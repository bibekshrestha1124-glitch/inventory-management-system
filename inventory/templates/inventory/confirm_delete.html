{% extends 'inventory/base.html' %}
{% block title %}Delete{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card"><div class="card-body p-4">
    <h4 class="text-danger">Delete "{{ object }}"?</h4>
    <p class="text-muted mb-1">This action cannot be undone.</p>
    {% if warning %}<p class="small">{{ warning }}</p>{% endif %}
    <form method="post" class="mt-3">{% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
