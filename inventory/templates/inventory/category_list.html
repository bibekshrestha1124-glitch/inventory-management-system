{% extends 'inventory/base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">Categories</h3>
  <a href="{% url 'inventory:category_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add category</a></div>
<form method="get" class="mb-3 d-flex gap-2"><input name="q" value="{{ request.GET.q }}" class="form-control" placeholder="Search categories"><button class="btn btn-dark">Search</button></form>
<div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
  <thead class="table-light"><tr><th>Name</th><th>Description</th><th class="text-end">Products</th><th class="text-end">Actions</th></tr></thead>
  {% for c in object_list %}<tr><td class="fw-semibold">{{ c.name }}</td><td>{{ c.description|default:"-" }}</td><td class="text-end"><a href="{% url 'inventory:product_list' %}?category={{ c.pk }}">{{ c.n }}</a></td>
  <td class="text-end"><a href="{% url 'inventory:category_update' c.pk %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a> <a href="{% url 'inventory:category_delete' c.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a></td></tr>
  {% empty %}<tr><td colspan="4" class="text-center text-muted py-4">No categories found.</td></tr>{% endfor %}
</table></div></div>
{% endblock %}
