{% extends 'inventory/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body p-4">
  <h4 class="mb-3">Sign in</h4>
  <form method="post" novalidate>{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
    <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" autofocus required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-0 small text-center">No account? <a href="{% url 'inventory:register' %}">Register</a></p>
</div></div></div></div>
{% endblock %}
